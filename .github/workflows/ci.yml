name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repo
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m compileall -q backend scripts

      - name: Validate SFT datasets
        run: |
          for version_dir in data/v*; do
            if [ -d "$version_dir" ]; then
              version="$(basename "$version_dir")"
              python scripts/validate_jsonl.py "$version"
            fi
          done

      - name: Check deployment adapter is explicit
        run: |
          adapter="$(grep -E '^ENV ADAPTER_DIR=' Dockerfile | sed 's/^ENV ADAPTER_DIR=//')"
          echo "Dockerfile ADAPTER_DIR=$adapter"

          case "$adapter" in
            stefanind/qwen-stefan-lora-v[0-9][0-9][0-9])
              ;;
            *)
              echo "::error::ADAPTER_DIR must be an explicit versioned adapter like stefanind/qwen-stefan-lora-v001"
              exit 1
              ;;
          esac
